# Builds JLB IDE on GitHub's machines: a Windows installer, plus Linux packages.
# Runs when a version tag (like v0.1.0) is pushed, or by hand from the Actions tab
# ("Run workflow"). The finished files appear under the run's "Artifacts".

name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the Rust interpreter (jlb-rust)
        uses: actions/checkout@v4
        with:
          repository: ASDFboy/jlb-rust
          path: jlb-rust

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev

      - name: Build the interpreter and bundle it
        shell: bash
        run: |
          cargo build --release --manifest-path jlb-rust/Cargo.toml
          mkdir -p src-tauri/interpreters
          rm -f src-tauri/interpreters/jlb src-tauri/interpreters/jlb.exe
          cp jlb-rust/target/release/jlb* src-tauri/interpreters/ 2>/dev/null || true
          rm -f src-tauri/interpreters/*.d src-tauri/interpreters/*.pdb
          ls -la src-tauri/interpreters

      - run: npm ci

      - name: Build the app
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: jlb-ide-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
