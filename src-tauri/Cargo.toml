[package]
name = "jlb-ide"
version = "0.1.0"
description = "An IDE for the .jlb programming language"
authors = ["ASDFboy", "Claude"]
repository = "https://github.com/ASDFboy/jlb-ide"
edition = "2021"

[lib]
name = "jlb_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
